manifest:
  remotes:
    - name: upstream
      url-base: https://git.codelinaro.org/clo/le/qzephyr/upstream
    - name: qoss
      url-base: https://git.codelinaro.org/clo/le/qzephyr/qoss
    - name: prop
      url-base: https://git.codelinaro.org/clo/le/qzephyr/prop
    - name: zephyrproject-rtos
      url-base: https://git.codelinaro.org/clo/le/qzephyr/zephyrproject-rtos
  defaults:
    remote: zephyrproject-rtos
    revision: main
  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: kernel.qzephyr.2.0.r1-rel
      import:
        # By using name-allowlist we can clone only the modules that are
        # strictly needed by the application.
        name-allowlist:
          - zcbor      # for c++ programming
    - name: mbedtls
      remote: zephyrproject-rtos
      revision: mbedtls.qzephyr.2.0.r1-rel
      path: modules/crypto/mbedtls
    - name: hostap
      remote: zephyrproject-rtos
      revision: hostap.qzephyr.2.0.r1-rel
      path: modules/lib/hostap
    - name: littlefs
      remote: zephyrproject-rtos
      revision: littlefs.qzephyr.2.0.r1-rel
      path: modules/fs/littlefs
    - name: segger
      remote: zephyrproject-rtos
      revision: segger.qzephyr.2.0.r1-rel
      path: modules/debug/segger
    - name: qapp
      remote: qoss
      revision: qapp.qzephyr.1.0.r1-rel
    - name: qhal
      remote: upstream
      revision: hal.qhal.1.0.r1-rel
      path: modules/hal/qcom
    - name: cmsis_6
      remote: zephyrproject-rtos
      revision: cmsis_6.qzephyr.2.0.r1-rel
      path: modules/hal/cmsis_6
  self:
    west-commands: zephyr/scripts/west-commands.yml
