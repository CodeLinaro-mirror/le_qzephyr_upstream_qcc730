compatible: "qcom,qcc730-spi"

include: [spi-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  pin-num:
    type: int
    required: true
    description: |
      Number of the pin initialized as input. Slave DW GPIO pin.
    default: 5
